<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhasa AI - Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header class="navbar">
    <div class="logo">
        <span>भ</span> Bhasa AI
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/demo.html">Demo</a>
        <a href="/about.html">About</a>
        <a href="/advantages.html">Advantages</a>
    </nav>

    <div class="nav-buttons">
        <a href="/login.html" class="login-btn">
            Login
        </a>
    </div>
</header>

<section class="auth-page">
    <div class="auth-box">
        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Join Bhasa AI today
        </p>

        <form onsubmit="signupUser(event)">
            <div class="form-group">
                <label for="signupName">Full Name</label>
                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="signupEmail">Email</label>
                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="signupPassword">Password</label>
                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >
            </div>

            <button
                type="submit"
                id="signupSubmitBtn"
                class="primary-btn full-btn">
                Create Account
            </button>

            <div id="signupMsg" style="margin-top: 15px; text-align: center; font-weight: 600; font-size: 14px;"></div>
        </form>

        <p style="text-align:center; margin-top:20px;">
            Already have an account?
            <a href="/login.html" style="color:#4f46e5; font-weight:600;">
                Login
            </a>
        </p>
    </div>
</section>

<script src="{{ url_for('static', filename='javascript/script.js') }}"></script>
<script>
async function signupUser(event) {
    event.preventDefault();

    const name = document.getElementById("signupName").value.trim();
    const email = document.getElementById("signupEmail").value.trim();
    const password = document.getElementById("signupPassword").value.trim();
    const confirmPassword = document.getElementById("confirmPassword").value.trim();
    const msgBox = document.getElementById("signupMsg");
    const submitBtn = document.getElementById("signupSubmitBtn");

    if (password !== confirmPassword) {
        msgBox.innerText = "❌ Passwords do not match!";
        msgBox.style.color = "#dc2626";
        return;
    }

    msgBox.innerText = "Creating account...";
    msgBox.style.color = "#64748b";
    submitBtn.disabled = true;

    try {
        const response = await fetch('/api/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (data.success) {
            msgBox.innerText = "✅ " + data.message;
            msgBox.style.color = "#16a34a";
            setTimeout(() => {
                window.location.href = '/demo.html';
            }, 1000);
        } else {
            msgBox.innerText = "❌ " + (data.error || "Signup failed.");
            msgBox.style.color = "#dc2626";
        }
    } catch (error) {
        console.error("Signup error:", error);
        msgBox.innerText = "❌ Error connecting to server.";
        msgBox.style.color = "#dc2626";
    } finally {
        submitBtn.disabled = false;
    }
}
</script>

</body>
</html>
