<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhasa AI - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header class="navbar">
    <div class="logo">
        <span>भ</span> Bhasa AI
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/demo.html">Demo</a>
        <a href="/about.html">About</a>
        <a href="/advantages.html">Advantages</a>
    </nav>

    <div class="nav-buttons">
        <a href="/signup.html" class="signup-btn">Sign Up</a>
    </div>
</header>

<section class="auth-page">
    <div class="auth-box">
        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Login to your Bhasa AI account
        </p>

        <form onsubmit="loginUser(event)">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button class="primary-btn full-btn" type="submit" id="loginSubmitBtn">
                Login
            </button>

            <div id="loginMsg" style="margin-top: 15px; text-align: center; font-weight: 600; font-size: 14px;"></div>
        </form>

        <p style="text-align:center; margin-top:20px;">
            Don't have an account?
            <a href="/signup.html" style="color:#4f46e5; font-weight:600;">
                Create Account
            </a>
        </p>
    </div>
</section>

<script src="{{ url_for('static', filename='javascript/script.js') }}"></script>
<script>
async function loginUser(event) {
    event.preventDefault();

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value.trim();
    const msgBox = document.getElementById("loginMsg");
    const submitBtn = document.getElementById("loginSubmitBtn");

    msgBox.innerText = "Logging in...";
    msgBox.style.color = "#64748b";
    submitBtn.disabled = true;

    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (data.success) {
            msgBox.innerText = "✅ " + data.message;
            msgBox.style.color = "#16a34a";
            setTimeout(() => {
                window.location.href = '/demo.html';
            }, 1000);
        } else {
            msgBox.innerText = "❌ " + (data.error || "Login failed.");
            msgBox.style.color = "#dc2626";
        }
    } catch (error) {
        console.error("Login error:", error);
        msgBox.innerText = "❌ Error connecting to server.";
        msgBox.style.color = "#dc2626";
    } finally {
        submitBtn.disabled = false;
    }
}
</script>

</body>
</html>
